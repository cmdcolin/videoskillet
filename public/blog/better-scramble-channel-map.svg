<svg xmlns="http://www.w3.org/2000/svg" width="608" height="224" class="map" viewBox="0 0 304 112" role="group" aria-label="signal chain"><style>svg { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
/* The chain in miniature at the head of the signal path: one labeled box per
   stage, wired left to right, with the three feedback returns looping back over
   the top and input B joining from below. Box and label take currentColor, so
   one rule per state (idle / touched / open / off) colors a whole stage — and,
   on the branch, its wires with it. */
.map {
  display: block;
  width: 100%;
  margin: 10px 0 2px;
}
/* The svg scales to its box, so the labels grow with it — at the bench's 664px
   the miniature stops reading as a miniature. Cap it and let it sit at the left
   of the panel head, over the first column. */
@container panel (min-width: 540px) {
  .map {
    max-width: 420px;
  }
}
.mapWire {
  fill: none;
  stroke: #44444f;
  stroke-width: 1;
}
/* A box is a chip sitting *on* the wire, not another hairline drawn in the same
   colour as one. It used to share the declaration above — same stroke, same
   nothing for a fill — so the six things in the panel you are meant to click
   were drawn exactly like the five inert lines joining them, and the only thing
   that ever said otherwise was a line of prose under the graphic that went away
   for good after the first click. Everything else clickable in this sidebar is
   a filled control with a hover state; now this is too. */
.mapBox {
  fill: #26262e;
  stroke: #44444f;
  stroke-width: 1;
  /* SVG hit-tests what is painted, and the two states below paint no fill —
     which left an unfilled box pressable on its 1px outline and its label and
     nowhere else. Measured at 390px: the SOUND box is 42x26 and answered a
     press over 43x13 of that, the height of the word inside it. This says the
     rect is the target whatever it is filled with, which is what every other
     box on the drawing already was. */
  pointer-events: all;
}
.mapArrow {
  fill: #44444f;
}
/* A feedback return, wire and arrowhead as one colour so a running loop lights
   both. Dashed for the optical loop and solid for the electrical one — the
   schematic convention, and the only difference between the two that a diagram
   this size can carry. */
.mapReturn {
  color: #44444f;
}
.mapReturn .mapWire {
  stroke: currentColor;
}
.mapReturn .mapArrow {
  fill: currentColor;
}
.mapReturnOptical .mapWire {
  stroke-dasharray: 2 2;
}
/* The run carries an edit, in the same amber a box wears for one. Written above
   the two accent states because a running loop, and the loop you are looking
   at, are both worth more than "something in here is off stock" — and a loop
   whose mix is up is off stock by definition, so the two would otherwise fight
   over every lit run. */
.mapReturnTouched {
  color: #ceba64;
}
.mapReturnTouched .mapLoopLabel {
  fill: #ceba64;
}
/* the loop is actually running — its mix is off zero */
.mapReturnLive {
  color: #7fd0a0;
}
/* A run the live query did not reach — the same statement .mapNodeDim makes,
   on the three stages that have a wire instead of a box. Its label goes with
   it: at --fg3 under the fade the word is still the loudest thing left on an
   otherwise faint run. Pressable like the boxes, and it comes back to full
   under the pointer for the same reason. */
.mapReturnDim {
  color: #44444f;
  opacity: 0.45;
}
.mapReturnDim:hover,
.mapReturnDim:focus-visible {
  opacity: 1;
}
.mapReturnDim .mapLoopLabel {
  fill: #a6a6ba;
}
/* The loop whose stage is open. Its chip takes the same tint an open box does,
   and its wire gets heavier as well — the weight is what survives being the
   same colour as `live`, and a running loop you have opened is the common
   case. */
.mapReturnOn {
  color: #7fd0a0;
}
.mapReturnOn .mapWire {
  stroke-width: 1.8;
}
.mapReturnOn .mapLoopChip {
  fill: color-mix(in srgb, #7fd0a0 14%, #26262e);
}
.mapReturnOn .mapLoopLabel {
  fill: #7fd0a0;
}
/* Each run is its own button, and the only way into that loop's stage. Colour
   runs the length of it — wire, arrowhead, name and chip — so pointing at any
   part of a loop lights all of it. */
.mapLoopBtn {
  cursor: pointer;
}
.mapLoopBtn:hover,
.mapLoopBtn:focus-visible {
  color: #e6e6ee;
}
.mapLoopBtn:focus-visible {
  outline: none;
}
.mapLoopBtn:focus-visible .mapWire {
  stroke-width: 2;
}
/* What makes a 1px wire pressable. Transparent rather than absent so it takes
   pointer events, and 8 units wide so it cannot reach the next run 10 away. */
.mapLoopHit {
  fill: none;
  stroke: transparent;
  stroke-width: 8;
}
/* A run's own name, on the chip below, set like a box's name.

   It does *not* take the run's colour, which is the one thing here that is not
   currentColor. An idle run is --border, and theme.css draws the line at --fg4:
   anything dimmer is decoration. A name is not decoration, so it sits at --fg3,
   one step under the stage names so a wire still reads as subordinate to a
   box. The two states that mean something do follow the run, and they are
   spelled out below because the fill above stops them arriving on their own. */
.mapLoopLabel {
  fill: #a6a6ba;
  font-size: 10px;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  user-select: none;
}
/* The chip that name rides — the run's own box, and the only one a loop gets:
   none of them is a stage of the trunk, so there is no point on the wire to
   stand one. Drawn like every box here (see .mapBox) because it is the same
   kind of thing to press. Its edge follows the run, so a chip lights with the
   loop it names.

   Its fill also does what the label used to do for itself: the name carried a
   stroke of the panel colour, painted first, to knock the wire out around the
   letters. A chip is that knockout with an edge on it, and a label inside one
   must not keep the stroke — it would halo every glyph against the face. */
.mapLoopChip {
  fill: #26262e;
  stroke: currentColor;
  stroke-width: 1;
}
.mapLoopBtn:hover .mapLoopChip,
.mapLoopBtn:focus-visible .mapLoopChip {
  fill: rgba(40, 40, 48, 0.85);
}
.mapLoopBtn:focus-visible .mapLoopChip {
  stroke-width: 2;
}
.mapReturnLive .mapLoopLabel {
  fill: #7fd0a0;
}
.mapLoopBtn:hover .mapLoopLabel,
.mapLoopBtn:focus-visible .mapLoopLabel {
  fill: #e6e6ee;
}
/* A stage a live query did not reach. It stays on the map because the map is
   the chain: a search for "ghost" is asking where in the chain that lives, and
   the drawing used to answer by removing every box but the two that matched and
   re-laying out the rest — which is the one shape that cannot answer it.

   Faint rather than restyled, and it replaces the idle rule instead of layering
   over it (see ChainMap's className): the four states below are about the rig
   and the look, and this one is about the search box, so a dimmed box says that
   and nothing else.

   Still a door, though, and that is what the pointer and the hover are for. It
   used to sit at 0.3 with neither, which was right for a typed query that misses
   two boxes and wrong for one that misses ten: the count on the modulation strip
   narrows the panel to whatever the bay is driving, and the map answered by
   greying out the whole chain — including the MODULATION box you would press to
   undo it. A box that comes back to full under the pointer reads as out of
   scope; one that cannot be pressed at all reads as broken. */
.mapNodeDim {
  color: #c6c6d6;
  opacity: 0.45;
  cursor: pointer;
}
.mapNodeDim:hover,
.mapNodeDim:focus-visible {
  color: #e6e6ee;
  opacity: 1;
}
.mapNode {
  color: #c6c6d6;
  cursor: pointer;
}
.mapNode:hover {
  color: #e6e6ee;
}
.mapNode:hover .mapBox {
  fill: rgba(40, 40, 48, 0.85);
}
/* the stage carries an edit — the same amber the rest of the sidebar marks one
   with */
.mapNodeTouched {
  color: #ceba64;
}
.mapNodeOn {
  color: #7fd0a0;
}
/* The stage that is open, tinted as well as outlined: on a row of six filled
   chips a stroke alone is a thin claim, and this is the map's answer to "where
   am I". */
.mapNodeOn .mapBox {
  fill: color-mix(in srgb, #7fd0a0 14%, #26262e);
}
/* A stage that cannot be opened: Mix and input B with nothing patched into B.
   Drawn rather than dropped — together they are the one thing on screen saying
   a second input exists — so they have to read as absent rather than merely
   unvisited, which is what the dashed outline, the flat fill and the
   dimmer-than-idle colour are for. */
.mapNodeOff {
  color: #44444f;
  cursor: default;
}
.mapNodeOff .mapBox {
  fill: none;
  stroke: currentColor;
  stroke-dasharray: 2 2;
}
/* The whole B run — its lead-in and the wire up into the trunk — goes with the
   node, so an unpatched input reads as one dim thing rather than a dim box on
   live wiring. */
.mapBranchOff .mapWire {
  stroke: #2e2e38;
}
.mapBranchOff .mapArrow {
  fill: #2e2e38;
}
/* And the same for a branch the query missed: the box fades on its own class,
   so without this its wire stays at full strength and the box reads as
   disconnected rather than as out of scope. */
.mapBranchDim {
  opacity: 0.45;
}
/* The group above carries the fade for the whole run, box included, so the box
   must not fade a second time inside it — 0.45 of 0.45 is not a dim box, it is
   a box that has left the drawing. The hover has to be restated for the same
   reason: the group is what the pointer brings back, so the box inside it has
   nothing left of its own to raise. */
.mapBranchDim .mapNodeDim {
  opacity: 1;
}
.mapBranchDim:hover {
  opacity: 1;
}
.mapNode:hover .mapBox,
.mapNodeTouched .mapBox,
.mapNodeOn .mapBox {
  stroke: currentColor;
}
/* svg user units, which are px at the sidebar's width: 10px caps in a 26-unit
   box. */
.mapLabel {
  fill: currentColor;
  font-size: 10px;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  /* the box is the target, and a drag that starts on a label should not select
     the word instead of pressing the stage */
  user-select: none;
}
/* What is standing in a box that has a picker, captioned under its name. Three
   boxes wear one — the two sources and the sound — and the register is the whole
   reason it does not turn the map into a wall of text: 8px mixed case under 10px
   caps, at --fg3, so the row still reads as six names with something written
   under three of them rather than as twelve labels.

   Not currentColor, for the same reason .mapLoopLabel is not: the caption is
   subordinate to the name at every state, and following the state would put it
   in amber beside a name in amber and double the mark. */
.mapSub {
  fill: #a6a6ba;
  font-size: 8px;
  letter-spacing: 0.01em;
  user-select: none;
}
/* The two states where following the box *is* the point: an open stage owns its
   whole chip, and a dimmed one has left the conversation entirely. */
.mapNodeOn .mapSub {
  fill: #7fd0a0;
}
.mapNodeDim .mapSub {
  fill: currentColor;
}
