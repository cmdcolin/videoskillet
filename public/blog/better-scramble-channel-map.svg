ass="mapLabel" x="90.95" y="57" text-anchor="middle" dominant-baseline="central">Mix</text></g><g class="mapNode mapNodeTouched" role="button" tabindex="0" aria-label="Channel — everything between the encoder and the aerial socket: the tape it was recorded on, the tuner it came through, and the cable it came down"><title>Channel — everything between the encoder and the aerial socket: the tape it was recorded on, the tuner it came through, and the cable it came down (2 off stock)</title><rect class="mapBox" x="115.50000000000001" y="44" width="52.1" height="26" rx="3"></rect><text class="mapLabel" x="141.55" y="57" text-anchor="middle" dominant-baseline="central">Channel</text></g><g class="mapNode mapNodeTouched" role="button" tabindex="0" aria-label="Receiver — a TV finding sync and decoding colour from whatever arrives: hold, deflection, the decoder"><title>Receiver — a TV finding sync and decoding colour from whatever arrives: hold, deflection, the decoder (12 off stock)</title><rect class="mapBox" x="178.7" y="44" width="58.4" height="26" rx="3"></rect><text class="mapLabel" x="207.89999999999998" y="57" text-anchor="middle" dominant-baseline="central">Receiver</text></g><g class="mapNode" role="button" tabindex="0" aria-label="Screen — the tube itself: beam profile, phosphor persistence, shadow mask"><title>Screen — the tube itself: beam profile, phosphor persistence, shadow mask</title><rect class="mapBox" x="248.19999999999996" y="44" width="45.8" height="26" rx="3"></rect><text class="mapLabel" x="271.09999999999997" y="57" text-anchor="middle" dominant-baseline="central">Screen</text></g></svg>
