      <g clip-path="url(#f2)"><use href="#bars" transform="translate(-2.4 0)"/></g>
      <g clip-path="url(#f3)"><use href="#bars"/></g>
      <ellipse cx="13" cy="23.6" rx="7.8" ry="3.1" fill="url(#scan)"/>
      <ellipse cx="13" cy="23.6" rx="7.8" ry="3.1" fill="url(#sheen)"/>
