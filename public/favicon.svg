<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#0a0b0d"/>
  <defs>
    <linearGradient id="lip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a8088"/><stop offset="1" stop-color="#4a4f56"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1113"/><stop offset="0.45" stop-color="#22262b"/><stop offset="1" stop-color="#5c636b"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa0a8"/><stop offset="0.5" stop-color="#5b6169"/><stop offset="1" stop-color="#2a2e33"/>
    </linearGradient>
    <clipPath id="floorclip"><ellipse cx="13" cy="23.6" rx="7.8" ry="3.1"/></clipPath>
    <g id="bars">
      <rect x="5"    y="20" width="2.3" height="8" fill="#c0c0c0"/>
      <rect x="7.3"  y="20" width="2.3" height="8" fill="#c7c71f"/>
      <rect x="9.6"  y="20" width="2.3" height="8" fill="#1fc7c7"/>
      <rect x="11.9" y="20" width="2.3" height="8" fill="#1fc71f"/>
      <rect x="14.2" y="20" width="2.3" height="8" fill="#c71fc7"/>
      <rect x="16.5" y="20" width="2.3" height="8" fill="#c71f1f"/>
      <rect x="18.8" y="20" width="2.3" height="8" fill="#1f1fc7"/>
