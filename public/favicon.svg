    <radialGradient id="sheen" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#fff" stop-opacity="0.25"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g fill="none" stroke-width="2.4" stroke-linecap="round">
    <path d="M8.5 13.5 C6.6 11.4 9.6 9.8 8.1 7.4" stroke="#c7c71f"/>
    <path d="M13 13.3 C10.7 10.8 14.7 8.8 12.8 6 C11.7 4.4 12.8 3.2 13.3 2.2" stroke="#1fc7c7"/>
    <path d="M17.5 13.5 C16 11.7 18.9 10.3 17.6 8.1" stroke="#c71fc7"/>
  </g>
  <g fill="none" stroke-width="2.4" stroke-linecap="round" opacity="0.55">
    <path d="M8.5 13.5 C6.6 11.4 9.6 9.8 8.1 7.4" stroke="#c7c71f" transform="translate(-1.6 -0.4)"/>
    <path d="M13 13.3 C10.7 10.8 14.7 8.8 12.8 6 C11.7 4.4 12.8 3.2 13.3 2.2" stroke="#1fc7c7" transform="translate(1.8 -0.6)"/>
