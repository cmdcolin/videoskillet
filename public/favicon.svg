    <clipPath id="f1"><rect x="0" y="20"   width="32" height="2.4"/></clipPath>
    <clipPath id="f2"><rect x="0" y="22.4" width="32" height="1.2"/></clipPath>
    <clipPath id="f3"><rect x="0" y="23.6" width="32" height="4.4"/></clipPath>
    <pattern id="scan" width="1" height="1.2" patternUnits="userSpaceOnUse">
