    <ellipse cx="29.0" cy="18.6" rx="0.35" ry="0.19" fill="#0a0b0d"/>
    <ellipse cx="13" cy="22.3" rx="10.6" ry="5.6" fill="url(#lip)"/>
    <ellipse cx="13" cy="22.3" rx="9.7" ry="4.9" fill="url(#wall)"/>
    <g clip-path="url(#floorclip)">
