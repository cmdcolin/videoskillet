<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so env(safe-area-inset-*) reports the notch/home-bar
         insets the panel pads itself away from -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Relative, like every other reference out of a page directory: the build
         has to run from a sub-path as well as from the root (src/publicUrl.ts).
         Everything inside the manifest is in turn relative to the manifest. -->
    <link rel="manifest" href="../manifest.webmanifest" />
    <!-- iOS reads neither the manifest's icons nor an SVG, so the home-screen
         icon is this tag or it is a screenshot of the page. -->
    <link rel="apple-touch-icon" href="../apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="videoskillet" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- black-translucent puts the page under the status bar, which is what
         viewport-fit=cover and the panel's safe-area padding already assume. -->
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="theme-color" content="#000000" />
    <title>videoskillet.js</title>
    <meta
      name="description"
      content="Real-time NTSC / VHS / composite-video glitch simulator in WebGPU — dot crawl, dropouts, head-switch wobble and video feedback emerge from a simulated analog signal, not filters painted on top."
    />
    <link rel="canonical" href="https://videoskillet.com/app/" />

    <!-- Open Graph / Twitter: how the link unfurls when shared -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://videoskillet.com/app/" />
    <meta
      property="og:title"
      content="videoskillet.js — real-time NTSC / VHS glitch simulator in WebGPU"
    />
    <meta
      property="og:description"
      content="Analog video glitches — dot crawl, dropouts, head-switch wobble, video feedback — that fall out of a simulated NTSC signal path, live in the browser."
    />
    <meta property="og:image" content="https://videoskillet.com/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="videoskillet.js — real-time NTSC / VHS glitch simulator in WebGPU"
    />
    <meta
      name="twitter:description"
      content="Analog video glitches — dot crawl, dropouts, head-switch wobble, video feedback — that fall out of a simulated NTSC signal path, live in the browser."
    />
    <meta name="twitter:image" content="https://videoskillet.com/og.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
