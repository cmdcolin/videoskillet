name: Release

# Fires on the tag `pnpm pat` / `pnpm min` / `pnpm maj` pushes. `pnpm ship`
# makes no tag, so an ordinary push to main deploys the site and does nothing
# here.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Two builds are inputs to every binary below, and both need node and the
  # app's dependencies: the engine bundle the renderer runs, and the app that
  # `videoskillet serve` hosts out of the executable. Built once here so the
  # compile job can be a matrix over targets without the dependencies.
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm render:build
      - run: pnpm build
      - uses: actions/upload-artifact@v5
        with:
          name: engine-bundle
          path: scripts/render/build
      - uses: actions/upload-artifact@v5
        with:
          name: app-build
          path: dist

  binaries:
    needs: bundle
    runs-on: ubuntu-latest
    strategy:
      # One target failing should not withdraw the platforms that built.
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/download-artifact@v6
        with:
          name: engine-bundle
          path: scripts/render/build
      - uses: actions/download-artifact@v6
        with:
          name: app-build
          path: dist
      # `deno compile` cross-compiles, so every platform is built on this one
      # runner. Through the script rather than inline, so the list of app files
      # baked into the executable is written once (scripts/render/compile.mjs);
      # `--no-bundle` skips the vite step, since the bundle arrived above.
      - name: Compile
        env:
          TARGET: ${{ matrix.target }}
        run:
          node scripts/render/compile.mjs --no-bundle --target="$TARGET"
          --out=dist-bin
      # A tarball for the platforms whose shells keep the executable bit, a zip
      # for the one that does not.
      - name: Package
        id: package
        env:
          NAME: videoskillet-${{ matrix.target }}
        working-directory: dist-bin
        run: |
          if [ -f "$NAME.exe" ]; then
            zip -q "$NAME.zip" "$NAME.exe"
            echo "asset=$NAME.zip" >> "$GITHUB_OUTPUT"
          else
            tar czf "$NAME.tar.gz" "$NAME"
            echo "asset=$NAME.tar.gz" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: binary-${{ matrix.target }}
          path: dist-bin/${{ steps.package.outputs.asset }}

  # Both of the jobs that publish something are tag-only. A manual dispatch is
  # for rebuilding the binaries against a new Deno, and has no version to
  # release under. The release goes out with whichever targets built, so a
  # failed one does not hold back the rest.
  release:
    needs: binaries
    if:
      ${{ !cancelled() && needs.binaries.result != 'skipped' &&
      startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v6
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist-bin
      - name: Checksums
        run: cd dist-bin && sha256sum * > SHA256SUMS
      # Draft, so a release goes out when someone has looked at it. The tag is
      # already public by this point; the binaries are not.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          generate_release_notes: true
          files: dist-bin/*
          body: |
            Offline renderer binaries. Each one carries the renderer, the
            engine and a Deno runtime; ffmpeg and ffprobe have to be on PATH,
            and rendering needs a GPU driver Deno's WebGPU can reach.

            ```
            tar xzf videoskillet-x86_64-unknown-linux-gnu.tar.gz
            ./videoskillet-x86_64-unknown-linux-gnu in.mp4 out.mov --preset=vhs
            ```

            See [docs/CLI.md](docs/CLI.md) for the options.

  # src/core, restaged so it resolves without Vite. The version comes from
  # package.json, which the same commit as this tag bumped, so the published
  # version and the tag always agree. It waits on `bundle` so that a tag whose
  # build fails publishes nothing.
  jsr:
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # No dependencies: the stager reads package.json and node builtins only.
      - run: node scripts/jsrpack.mjs
      - run: deno publish
        working-directory: jsr
